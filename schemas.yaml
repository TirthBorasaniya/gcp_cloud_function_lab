# Table definitions for the ETL pipeline.
# Each uploaded file is matched to one table by file_pattern, a shell-style wildcard on the file name.
# allowed_values and minimum are validation rules checked before loading; they are not sent to BigQuery.
# Every table also receives the audit columns ingested_at and source_file automatically.

tables:
  - name: orders
    file_pattern: "orders_*.json"
    format: NEWLINE_DELIMITED_JSON
    schema:
      - name: order_id
        type: STRING
        mode: REQUIRED
      - name: customer_id
        type: STRING
        mode: REQUIRED
      - name: order_date
        type: DATE
        mode: REQUIRED
      - name: status
        type: STRING
        mode: REQUIRED
        allowed_values: [pending, shipped, delivered, cancelled]
      - name: items
        type: RECORD
        mode: REPEATED
        fields:
          - name: sku
            type: STRING
            mode: REQUIRED
          - name: quantity
            type: INT64
            mode: REQUIRED
            minimum: 1
          - name: unit_price
            type: FLOAT64
            mode: REQUIRED
            minimum: 0
      - name: shipping
        type: RECORD
        mode: NULLABLE
        fields:
          - name: city
            type: STRING
          - name: state
            type: STRING
          # stored as text so leading zeros such as 02115 are kept
          - name: zip
            type: STRING

  - name: customers
    file_pattern: "customers_*.csv"
    format: CSV
    schema:
      - name: customer_id
        type: STRING
        mode: REQUIRED
      - name: name
        type: STRING
        mode: REQUIRED
      - name: email
        type: STRING
      - name: signup_date
        type: DATE
        mode: REQUIRED
      - name: is_member
        type: BOOL
      - name: country
        type: STRING
